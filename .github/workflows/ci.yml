name: CI

# Runs on every pull request and on pushes to main.
# Required to pass before merging (set in Settings → Branches).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Type errors (no new ones allowed)
        run: node scripts/check-type-errors.mjs

      - name: Build
        run: pnpm build
